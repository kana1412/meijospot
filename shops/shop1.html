<!-- shops/shop3.html: 店舗詳細ページ（秀吉） -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英吉家 | MeijoSpot</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- 共通ヘッダー -->
  <header class="header">
    <a href="../index.html" class="logo">
      <img src="../img/rogo.png" alt="MeijoSpot ロゴ">
    </a>
    <div class="search">
      <img src="../img/rogo2.png" class="search-icon" alt="検索アイコン">
      <input id="searchInput" type="search" placeholder="店舗名・ジャンルで検索">
    </div>
    <button id="menuBtn" class="hamburger" aria-label="メニュー">☰</button>
  </header>

  <!-- ドロワーメニュー -->
  <nav id="drawer" class="drawer">
    <a href="../index.html" class="drawer-link">トップ</a>
    <a href="../pages/contact.html" class="drawer-link">お問い合わせ</a>
    <a href="../pages/news.html" class="drawer-link">お知らせ</a>
    <a href="../pages/access.html" class="drawer-link">アクセス</a>
    <a href="../pages/find.html" class="drawer-link">お店を探す</a>
    <a href="../pages/map.html" class="drawer-link">マップ</a>
  </nav>

  <!-- 画像スライダー -->
  <section class="detail-hero">
    <img class="active" src="../img/hideyoshi.jpg" alt="ラーメン">
    <img src="../img/外観.jpg" alt="外観">
    <button class="arrow prev" aria-label="前へ">‹</button>
    <button class="arrow next" aria-label="次へ">›</button>

    <!-- ★ 店名（背景帯を消去、より下に寄せた） -->
    <h1 class="store-title-overlay">英吉家</h1>
  </section>

  <!-- 基本情報 -->
  <section class="store-info">
    <p>🍽️ <b>ジャンル：</b>ラーメン</p>
    <p>🕒 <b>営業時間：</b>11:00〜20:00（仮）</p>
    <p>🗺️ <b>場所：</b>名城大学周辺（仮）</p>
    <p>💬 <b>紹介：</b>自家製スープが売りのラーメン店です。</p>
  </section>

  <!-- ギャラリー
  <section class="gallery" aria-label="メニューギャラリー">
    <img src="../img/ra-men.jpg" alt="メニュー1">
    <img src="../img/外観.jpg" alt="メニュー2">
    <img src="../img/Top.jpg" alt="メニュー3">
  </section>
  -->

  <!-- 地図 -->
  <section class="map-block">
    <h2>マップ</h2>
    <iframe loading="lazy" src="https://www.google.com/maps?q=35.1561,136.9635&hl=ja&z=16&output=embed"></iframe>
  </section>

  <footer class="footer">
    <small>© 2025 MeijoSpot</small>
  </footer>

  <!-- JS -->
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const drawer  = document.getElementById('drawer');
    menuBtn.addEventListener('click', () => drawer.classList.toggle('open'));
    drawer.addEventListener('click', e => {
      if (e.target.matches('.drawer-link')) drawer.classList.remove('open');
    });

    const imgs = [...document.querySelectorAll('.detail-hero img')];
    let i = 0;
    const show = n => imgs.forEach((el, k) => el.classList.toggle('active', k === n));
    document.querySelector('.arrow.prev').onclick = () => { i = (i - 1 + imgs.length) % imgs.length; show(i); };
    document.querySelector('.arrow.next').onclick = () => { i = (i + 1) % imgs.length; show(i); };
  </script>
</body>
</html>
