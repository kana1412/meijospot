<!-- map.html: 地図に店舗ピンを表示するページ -->
<!DOCTYPE html> <!-- HTML5宣言 -->
<html lang="ja"> <!-- 文書言語を日本語に設定 -->
<head> <!-- ヘッダー情報 -->
  <meta charset="UTF-8"> <!-- 文字コードをUTF-8に設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- モバイル最適化 -->
  <title>マップ | MeijoSpot</title> <!-- タイトル -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"> <!-- LeafletのCSSをCDNから読み込み -->
  <style> /* 必要最小限のページ内スタイル */
    body{margin:0;font-family:system-ui,sans-serif;} /* 余白を消し基本フォントを指定 */
    header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #eee;} /* 簡易ヘッダー */
    header img{width:120px;} /* ロゴの幅 */
    #map{height:calc(100vh - 60px);} /* 画面全体からヘッダー分を引いた高さを地図に割り当て */
  </style> <!-- スタイル終了 -->
</head> <!-- ヘッダー情報終了 -->
<body> <!-- 本文開始 -->
  <header class="header"> <!-- ヘッダー全体のラッパー -->
    <a href="../index.html" class="logo"> <!-- ロゴをクリックでトップへ -->
      <img src="../img/rogo.png" alt="MeijoSpot ロゴ"> <!-- 指定のロゴ画像を表示 -->
    </a> <!-- ロゴリンクの終了 -->

    <div class="search"> <!-- 検索ボックスのラッパー -->
      <img src="../img/rogo2.png" class="search-icon" alt="検索アイコン"> <!-- 左側の虫眼鏡アイコン -->
      <input id="searchInput" type="search" placeholder="店舗名・ジャンルで検索"> <!-- 検索入力欄 -->
    </div> <!-- 検索ボックスの終了 -->

    <button id="menuBtn" class="hamburger" aria-label="メニュー"> <!-- ハンバーガーボタン -->
      ☰ <!-- シンプルな3本線の代替文字 -->
    </button> <!-- ハンバーガーボタンの終了 -->
  </header>
  <link rel="stylesheet" href="../css/styles.css">
    <nav id="drawer" class="drawer"> <!-- スライド表示のナビ -->
    <a href="../index.html" class="drawer-link">トップ</a> <!-- トップへのリンク -->
    <a href="../pages/contact.html" class="drawer-link">お問い合わせ</a> <!-- お問い合わせへのリンク -->
    <a href="../pages/news.html" class="drawer-link">お知らせ</a> <!-- お知らせへのリンク -->
    <a href="../pages/map.html" class="drawer-link">マップ</a> <!-- 地図ページへのリンク -->
     <button class="drawer-link" type="button">閉じる</button>
  </nav> <!-- ドロワーメニュー終了 -->
    <script src = "../js/app.js"> // 画像切替用の最小スクリプト
    const imgs=[...document.querySelectorAll('.hero img')]; // 画像要素を配列取得
    let i=0; // 現在のインデックス
    function show(n){ imgs.forEach((el,k)=>el.classList.toggle('active',k===n)); } // 指定だけ表示
    document.querySelector('.prev').onclick=()=>{ i=(i-1+imgs.length)%imgs.length; show(i); }; // 前へボタンの処理
    document.querySelector('.next').onclick=()=>{ i=(i+1)%imgs.length; show(i); }; // 次へボタンの処理
  </script> <!-- スクリプト終了 -->

  <div id="map"></div> <!-- 地図の描画領域 -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> <!-- Leaflet本体の読み込み -->
  <script> // 地図表示用のスクリプト開始
    const center = [35.135063,  136.976443]; // 名城大学（ナゴヤドーム前矢田近辺）の仮中心座標
    const map = L.map('map').setView(center, 15); // 地図を作成し中心とズームを設定
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(map); // OSMタイルを表示

    // サンプルの店舗座標（実店舗に合わせて調整可能）
const shops = [
  { id: 1, name: '横浜家系ラーメン英吉家', lat: 35.134382, lng: 136.978485 },
  { id: 2, name: 'green bakery', lat: 35.134027, lng: 136.974120 }
  ];

 shops.forEach(s => {
  L.marker([s.lat, s.lng]).addTo(map)
    .bindPopup(`
      <b>${s.name}</b><br>
      <a href="../shop.html?id=${s.id}">詳細を見る</a>
    `);
});
  </script> <!-- スクリプト終了 -->
</body> <!-- 本文終了 -->
</html> <!-- 文書終了 -->
